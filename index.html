<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Learning Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-pending">

<!-- Login overlay -->
<div class="login-overlay" id="login-overlay">
  <div class="login-card">
    <div style="font-size:48px;margin-bottom:12px">📚</div>
    <h2>My Learning</h2>
    <p>เข้าสู่ระบบด้วย Google เพื่อเริ่มเรียน</p>
    <button class="btn-drive-connect" id="btn-login">
      <svg width="18" height="18" viewBox="0 0 48 48" style="vertical-align:middle;margin-right:8px"><path fill="#4285F4" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.3 30.2 0 24 0 14.7 0 6.6 5.3 2.5 13.1l7.8 6C12.2 13 17.7 9.5 24 9.5z"/><path fill="#34A853" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.4c-.5 2.8-2.1 5.1-4.5 6.7l7 5.4C43.5 36.7 46.1 31 46.1 24.5z"/><path fill="#FBBC05" d="M10.3 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.8-6A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.5 10.7l7.8-6.1z"/><path fill="#EA4335" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7-5.4C30.2 38.9 27.3 40 24 40c-6.3 0-11.6-3.8-13.7-9.4l-7.8 6C6.6 44.5 14.7 48 24 48z"/></svg>
      เข้าสู่ระบบด้วย Google
    </button>
  </div>
</div>

<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span>📚</span> My Learning
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">วิชา</div>
      <a href="#" class="subject-tab active" data-subject="math">
        <span class="icon"><span class="subj-badge math-badge"><i class="fas fa-calculator"></i></span></span>
        <span class="name">คณิตศาสตร์</span>
      </a>
      <a href="#" class="subject-tab bio" data-subject="biology">
        <span class="icon"><span class="subj-badge bio-badge"><i class="fas fa-seedling"></i></span></span>
        <span class="name">ชีววิทยา</span>
      </a>
      <a href="#" class="subject-tab physics" data-subject="physics">
        <span class="icon"><span class="subj-badge physics-badge"><i class="fas fa-bolt"></i></span></span>
        <span class="name">ฟิสิกส์</span>
      </a>
    </div>

    <div class="sidebar-user" id="sidebar-user" style="display:none">
      <img class="user-avatar" id="user-avatar" src="" alt="">
      <div class="user-info">
        <div class="user-name" id="user-name"></div>
        <div class="user-email" id="user-email"></div>
      </div>
      <button class="btn-logout" id="btn-logout" title="ออกจากระบบ">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-content">
    <div id="subject-header" class="subject-header">
      <h1>📐 คณิตศาสตร์ ม.ต้น</h1>
      <div class="header-stats">
        <div class="stat-item">กำลังโหลด...</div>
      </div>
    </div>

    <div id="section-filter" class="section-filter"></div>

    <div id="courses-area" class="courses-area">
      <div style="padding:40px;text-align:center"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="https://accounts.google.com/gsi/client" async></script>
<script src="assets/js/storage.js"></script>
<script type="module" src="assets/js/index.js"></script>
</body>
</html>
